name: Build and Deploy Angular

on:
  push:
    branches:
      - master # 當你推送到 master 分支時觸發

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24' # 解決你的警告訊息，使用最新推薦版本

      - name: Install dependencies
        run: npm install

      - name: Build Angular app
        # 請確保專案名稱與 angular.json 一致
        run: npx ng build --configuration production --base-href /excel-reader/

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          # 注意：請先檢查本機執行 ng build 後，dist 裡面的確切資料夾結構
          # 如果沒有 SSR，通常是 dist/excel-reader
          # 如果有 SSR，通常是 dist/excel-reader/browser
          folder: dist/excel-reader/browser # Angular 17+ 預設路徑通常在此
          branch: gh-pages # 部署到的分支
